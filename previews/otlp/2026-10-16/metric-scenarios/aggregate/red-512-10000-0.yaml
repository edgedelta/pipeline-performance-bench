version: v3
settings:
  tag: otlp-benchmark
nodes:
- name: in
  type: otlp_input
  protocol: grpc
  port: 4317
- name: process
  type: sequence
  processors:
  - type: aggregate_metric
    data_types:
    - metric
    aggregate_metric_rules:
    - conditions:
      - 'true'
      interval: 10s
      aggregation_type: sum
      keep_only_group_by_keys: true
      group_by:
      - resource["service.name"]
      - resource["bench.batch"]
      - attributes["route"]
- name: out
  type: otlp_output
  protocol: http
  endpoint: 172.31.5.116
  port: 14318
  compression: uncompressed
links:
- from: in
  to: process
- from: process
  to: out
