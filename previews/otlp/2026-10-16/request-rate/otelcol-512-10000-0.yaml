receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
processors:
  batch:
    timeout: 100ms
    send_batch_size: 512
    send_batch_max_size: 512
exporters:
  otlphttp:
    endpoint: http://172.31.15.131:14318
    compression: none
    retry_on_failure:
      enabled: false
    sending_queue:
      enabled: false
service:
  pipelines:
    metrics:
      receivers:
      - otlp
      processors:
      - batch
      exporters:
      - otlphttp
