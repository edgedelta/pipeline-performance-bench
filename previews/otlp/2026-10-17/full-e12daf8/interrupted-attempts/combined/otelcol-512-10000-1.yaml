receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
processors:
  metricstransform/bench:
    transforms:
    - include: bench.requests
      action: update
      operations:
      - action: aggregate_labels
        label_set:
        - route
        aggregation_type: sum
  interval/bench:
    interval: 60s
exporters:
  otlphttp:
    endpoint: http://172.31.14.178:14318
    compression: none
    retry_on_failure:
      enabled: false
    sending_queue:
      enabled: false
    max_idle_conns: 1024
    max_idle_conns_per_host: 1024
    max_conns_per_host: 1024
service:
  pipelines:
    metrics:
      receivers:
      - otlp
      processors:
      - metricstransform/bench
      - interval/bench
      exporters:
      - otlphttp
