version: v3
settings:
  tag: otlp-benchmark
nodes:
- name: in
  type: otlp_input
  protocol: grpc
  port: 4317
- name: process
  type: sequence
  processors:
  - type: ottl_filter
    data_types:
    - metric
    condition: attributes["route"] == "health"
    filter_mode: exclude
- name: out
  type: otlp_output
  protocol: http
  endpoint: 172.31.13.30
  port: 14318
  compression: uncompressed
links:
- from: in
  to: process
- from: process
  to: out
