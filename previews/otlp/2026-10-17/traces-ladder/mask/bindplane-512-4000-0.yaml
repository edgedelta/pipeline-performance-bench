receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
processors:
  transform/bench:
    trace_statements:
    - context: span
      statements:
      - set(attributes["secret"], "REDACTED")
exporters:
  otlphttp:
    endpoint: http://172.31.12.223:14318
    compression: none
    retry_on_failure:
      enabled: false
    sending_queue:
      enabled: false
    max_idle_conns: 1024
    max_idle_conns_per_host: 1024
    max_conns_per_host: 1024
service:
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - transform/bench
      exporters:
      - otlphttp
