receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
processors:
  tail_sampling/bench:
    decision_wait: 1s
    num_traces: 4000000
    policies:
    - name: errors
      type: status_code
      status_code:
        status_codes:
        - ERROR
    expected_new_traces_per_sec: 2048000
  batch/tail:
    timeout: 500ms
    send_batch_size: 1000000
    send_batch_max_size: 1000000
exporters:
  otlphttp:
    endpoint: http://172.31.12.223:14318
    compression: none
    retry_on_failure:
      enabled: false
    sending_queue:
      enabled: false
    max_idle_conns: 1024
    max_idle_conns_per_host: 1024
    max_conns_per_host: 1024
service:
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - tail_sampling/bench
      - batch/tail
      exporters:
      - otlphttp
