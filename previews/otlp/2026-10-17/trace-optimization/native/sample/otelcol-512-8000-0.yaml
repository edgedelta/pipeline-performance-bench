receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
processors:
  probabilistic_sampler/bench:
    sampling_percentage: 50
    hash_seed: 22
exporters:
  otlphttp:
    endpoint: http://172.31.1.194:14318
    compression: none
    retry_on_failure:
      enabled: false
    sending_queue:
      enabled: false
    max_idle_conns: 1024
    max_idle_conns_per_host: 1024
    max_conns_per_host: 1024
service:
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - probabilistic_sampler/bench
      exporters:
      - otlphttp
