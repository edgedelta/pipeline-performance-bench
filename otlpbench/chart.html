<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pipeline Performance Benchmarks · Metrics & Traces</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px 24px;background:#101010;color:#ededed;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{max-width:1560px;margin:auto;padding:34px 36px 22px;border:1px solid #343434;border-radius:18px;background:#202020}h1{font-size:28px;letter-spacing:-.6px;margin:0 0 8px}.head{display:flex;justify-content:space-between;gap:24px;align-items:start}.sub{color:#999;line-height:1.6;font-size:15px}.seg{display:inline-flex;gap:3px;padding:4px;background:#101010;border:1px solid #363636;border-radius:10px;flex-wrap:wrap}.seg button{border:0;background:none;color:#aaa;font:inherit;padding:10px 14px;border-radius:7px;cursor:pointer;white-space:nowrap}.seg button.active{background:#363636;color:#fff}.seg button:hover{color:#fff}.controls{display:flex;gap:14px;flex-wrap:wrap;margin-top:24px}.legend{display:flex;gap:20px 26px;flex-wrap:wrap;margin:26px 0 24px}.legend button{border:0;background:none;color:#ccc;font:inherit;display:flex;align-items:center;gap:8px;padding:0;cursor:pointer}.legend button:first-child{font-weight:650;color:#fff}.legend button.off{opacity:.28}.sw{width:12px;height:12px;border-radius:3px}.version{font:11px ui-monospace,SFMono-Regular,monospace;color:#999}.plotwrap{overflow-x:auto;overflow-y:hidden;padding-top:6px}.plot{min-width:1050px;width:100%;height:520px}.plot text{font-family:ui-monospace,SFMono-Regular,monospace}.bar{transition:height .25s,opacity .15s}.bar:hover{filter:brightness(1.2)}.axislabel{font-size:12px;fill:#999}.foot{border-top:1px solid #383838;margin-top:22px;padding-top:18px;display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap;color:#999;font-size:12px;line-height:1.7}.foot button{font:inherit;color:#aaa;background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}#tooltip{position:fixed;display:none;background:#2c2c2c;border:1px solid #555;box-shadow:0 8px 32px #0009;padding:14px 16px;border-radius:10px;pointer-events:none;z-index:10;min-width:220px;font-size:13px;line-height:1.65}.tiphead{font-weight:650;margin-bottom:4px}.tipgrid{display:grid;grid-template-columns:1fr auto;gap:1px 20px;color:#aaa}.tipgrid b{color:#eee;font-weight:500;font-family:ui-monospace,monospace}.note{color:#ccc;margin-top:8px;max-width:290px}.topnote{color:#999;font-size:12px;margin-bottom:8px;letter-spacing:1px;text-transform:uppercase}.selector{margin-top:12px;display:flex;align-items:center;gap:10px;color:#999}.selector select{background:#292929;border:1px solid #444;border-radius:7px;padding:7px;color:#eee;font:inherit}.hint{font-size:11px;color:#888;margin-top:6px}.empty{padding:90px;text-align:center;color:#999}@media(max-width:760px){body{padding:12px}.card{padding:22px 16px}.head{flex-direction:column}h1{font-size:24px}.seg button{padding:9px 10px}.legend{gap:16px}.version{display:none}.plot{min-width:1100px}.foot{font-size:11px}}
</style></head><body><main class="card"><header class="head"><div><div class="topnote">Local preview · PR #29</div><h1>Pipeline Performance Benchmarks</h1><div class="sub" id="subtitle"></div></div><div class="seg" id="signals"></div></header><div class="controls"><div class="seg" id="tiers"></div><div class="seg" id="measures"></div></div><div class="legend" id="legend"></div><div class="selector"><label for="scenario">Scenarios</label><select id="scenario"><option value="all">All scenarios</option></select><span class="hint">Click a vendor to show or hide it</span></div><div class="plotwrap"><svg class="plot" id="plot" role="img" aria-label="Benchmark comparison chart"></svg></div><footer class="foot"><span id="runinfo"></span><span>Best on the left · dashed = load shortfall · N/A = no comparable measurement</span><button id="download">Download results</button></footer></main><div id="tooltip"></div>
<script>
const DATA=__DATA__;
const VENDORS=[['red','Edge Delta (Rust)','#00DA63'],['edgedelta','Edge Delta (Go)','#3B82F6'],['bindplane','Bindplane (Dynatrace)','#EF4444'],['otelcol','OpenTelemetry Collector','#9F4FFF'],['cribl','Cribl','#FF9554'],['vector','Vector (Datadog)','#E5C454'],['fluentbit','Fluent Bit','#F472B6'],['fluentd','Fluentd','#00C2D7']];
const SCENARIOS={metrics:['pass-through','filter','enrich','aggregate','rollup','combined'],traces:['pass-through','filter','enrich','mask','sample','tail','metrics']};
const NAMES={'pass-through':'Pass-Through',filter:'Filter',enrich:'Enrich',aggregate:'Aggregate',rollup:'Rollup',combined:'Combined',mask:'Mask',sample:'Sample',tail:'Tail',metrics:'Metrics'};
const RATES=[1000,10000,25000,50000,125000],TIERS=['Lowest','Low','Medium','High','Highest'];
const METRICS=[['core','per core','higher'],['memory','per MB','higher'],['cpu','CPU cores','lower'],['rss','Memory MB','lower'],['rate','reached','higher']];
let signal='metrics',rate=125000,metric='core',scenario='all',hidden=new Set();
const el=id=>document.getElementById(id),unit=()=>signal==='metrics'?'Points/sec':'Spans/sec';
const short=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'m':n>=1e3?(n/1e3).toFixed(n>=100000?0:1).replace(/\.0$/,'')+'k':n>=10?Math.round(n).toString():n.toFixed(2).replace(/\.00$/,'');
const fmt=n=>n==null?'N/A':n.toLocaleString('en-US',{maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function version(v){const raw=DATA[v]?.rows.find(r=>r.signal===signal)?.version||DATA[v]?.version||'';return raw.match(/v?\d+\.\d+\.\d+(?:-rc\.\d+)?/)?.[0]||'—'}
function buttons(id,values,selected,cb){el(id).replaceChildren(...values.map(([key,label])=>{const b=document.createElement('button');b.textContent=label;b.className=selected===key?'active':'';b.setAttribute('aria-pressed',selected===key);b.onclick=()=>{cb(key);render()};return b}));}
function cell(v,s){const row=DATA[v[0]]?.rows.find(r=>r.signal===signal&&r.scenario===s);const m=row?.measurements?.find(m=>m.rate===rate);let value=null;if(m?.cpu_cores!=null){value=metric==='core'?(m.cpu_cores>0?m.accepted_per_second/m.cpu_cores:null):metric==='memory'?m.accepted_per_second/m.rss_mb:metric==='cpu'?m.cpu_cores:metric==='rss'?m.rss_mb:m.accepted_per_second;}return{v,row,m,value,ok:m?.status==='measured'&&m.delivery_verified};}
function scale(max){if(!(max>0))return{max:1,step:.2};const raw=max/5,p=10**Math.floor(Math.log10(raw)),n=raw/p,step=(n<=1?1:n<=2?2:n<=5?5:10)*p;return{max:Math.ceil(max*1.15/step)*step,step};}
function svg(tag,attrs,text){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!=null)e.textContent=text;return e;}
function tooltip(e,c,s){const t=el('tooltip');let reason='No comparable measurement';if(c.row?.status==='not_configured')reason='No tested configuration for this scenario';else if(c.row?.status==='semantic_mismatch')reason='Scenario output did not match the requested operation';else if(c.m?.status==='generator_limited')reason='Load generator did not sustain this tier';else if(c.row?.status==='error')reason='Agent could not complete this scenario';t.innerHTML=`<div class="tiphead" style="color:${c.v[2]}">${esc(c.v[1])}</div><div>${NAMES[s]} · ${fmt(rate)} ${signal==='metrics'?'points':'spans'}/sec offered</div>${c.m?.cpu_cores!=null?`<div class="tipgrid"><span>Reached</span><b>${fmt(c.m.accepted_per_second)}/sec</b><span>CPU</span><b>${fmt(c.m.cpu_cores)} cores</b><span>Memory</span><b>${fmt(c.m.rss_mb)} MB</b><span>Per core</span><b>${fmt(c.m.accepted_per_second/c.m.cpu_cores)}/sec</b></div>${c.ok?'':'<div class="note">Load or delivery shortfall at this tier</div>'}`:`<div class="note">${reason}</div>`}<div class="version">${esc(version(c.v[0]))}</div>`;t.style.display='block';t.style.left=Math.min(e.clientX+14,innerWidth-t.offsetWidth-12)+'px';t.style.top=Math.max(12,Math.min(e.clientY-30,innerHeight-t.offsetHeight-12))+'px';}
function render(){
buttons('signals',[['metrics','Metrics'],['traces','Traces']],signal,x=>{signal=x;scenario='all'});
buttons('tiers',RATES.map((r,i)=>[r,TIERS[i]]),rate,x=>rate=x);
buttons('measures',METRICS.map(([k,n])=>[k,['core','memory','rate'].includes(k)?unit()+' '+n:n]),metric,x=>metric=x);
const meta=METRICS.find(x=>x[0]===metric);el('subtitle').textContent=`${['core','memory','rate'].includes(metric)?unit()+' ':''}${meta[1]} at ${TIERS[RATES.indexOf(rate)].toLowerCase()} load (${fmt(rate)} ${signal==='metrics'?'points':'spans'}/sec in) · ${meta[2]} is better`;
el('legend').replaceChildren(...VENDORS.map(v=>{const b=document.createElement('button');b.className=hidden.has(v[0])?'off':'';b.innerHTML=`<span class="sw" style="background:${v[2]}"></span><span>${esc(v[1])}</span><span class="version">${esc(version(v[0]))}</span>`;b.setAttribute('aria-pressed',!hidden.has(v[0]));b.onclick=()=>{hidden.has(v[0])?hidden.delete(v[0]):hidden.add(v[0]);render()};return b}));
el('scenario').innerHTML='<option value="all">All scenarios</option>'+SCENARIOS[signal].map(s=>`<option value="${s}">${NAMES[s]}</option>`).join('');el('scenario').value=scenario;
const scenarios=scenario==='all'?SCENARIOS[signal]:[scenario],vendors=VENDORS.filter(v=>!hidden.has(v[0]));
const groups=scenarios.map(s=>vendors.map(v=>cell(v,s)).sort((a,b)=>(a.value==null)-(b.value==null)||(b.ok-a.ok)||(meta[2]==='lower'?a.value-b.value:b.value-a.value)));
const axis=scale(Math.max(0,...groups.flat().map(c=>c.value||0))),plot=el('plot'),w=Math.max(plot.clientWidth,1050),h=520,left=62,right=12,top=40,bottom=460,ph=bottom-top,gw=(w-left-right)/scenarios.length;
plot.setAttribute('viewBox',`0 0 ${w} ${h}`);plot.replaceChildren();plot.append(svg('text',{x:left,y:18,class:'axislabel'},metric==='core'?unit().toLowerCase()+' per CPU core':metric==='memory'?unit().toLowerCase()+' per MB':metric==='cpu'?'CPU cores used (1 = one full core)':metric==='rss'?'average memory, MB':unit().toLowerCase()+' accepted'));
for(let n=0;n<=axis.max+axis.step*.1;n+=axis.step){const y=bottom-n/axis.max*ph;plot.append(svg('line',{x1:left,x2:w-right,y1:y,y2:y,stroke:'#373737'}),svg('text',{x:left-12,y:y+4,'text-anchor':'end',fill:'#999','font-size':11},short(n)));}
groups.forEach((cells,i)=>{const space=gw-24,slot=space/Math.max(cells.length,1),bw=Math.min(38,slot-4);cells.forEach((c,j)=>{const x=left+i*gw+12+j*slot+(slot-bw)/2,bh=c.value==null?2:Math.max(2,c.value/axis.max*ph),y=bottom-bh;const g=svg('g',{});g.append(svg('rect',{x:x-2,y:top,width:bw+4,height:ph,fill:'transparent'}));g.append(svg('rect',{class:'bar',x,y,width:Math.max(bw,2),height:bh,rx:3,fill:c.value==null?c.v[2]:c.ok?c.v[2]:c.v[2]+'28',opacity:c.value==null?.35:1,stroke:c.value!=null&&!c.ok?c.v[2]:'none','stroke-dasharray':'4 3'}));const label=svg('text',{x:x+bw/2,y:y-9,'text-anchor':'middle',fill:c.value==null?'#777':'#bbb','font-size':scenarios.length>4?9:11},c.value==null?'N/A':short(c.value));g.append(label);g.addEventListener('mousemove',e=>tooltip(e,c,scenarios[i]));g.addEventListener('mouseleave',()=>el('tooltip').style.display='none');plot.append(g)});plot.append(svg('text',{x:left+(i+.5)*gw,y:493,'text-anchor':'middle',fill:'#ddd','font-size':14},NAMES[scenarios[i]]));});
el('runinfo').textContent='2026-10-16 · OTLP/gRPC · Batch 512 · c8i.2xlarge · 30s per tier';
}
el('scenario').onchange=e=>{scenario=e.target.value;render()};el('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'}));a.download='otlp-benchmark-results.json';a.click();URL.revokeObjectURL(a.href)};
window.addEventListener('resize',render);render();
</script></body></html>
