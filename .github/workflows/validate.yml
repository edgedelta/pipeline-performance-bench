name: Validate benchmark harness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate Rust generator and matching HTTP behavior
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          cargo +1.98.0 fmt --manifest-path loadgen-rust/Cargo.toml --check
          cargo +1.98.0 clippy --locked --manifest-path loadgen-rust/Cargo.toml --all-targets -- -D warnings
          cargo +1.98.0 test --locked --manifest-path loadgen-rust/Cargo.toml
          cargo +1.98.0 build --locked --release --manifest-path loadgen-rust/Cargo.toml
          python3 tests/loadgen_protocol.py loadgen-rust/target/release/pipeline-loadgen-rust
          python3 tests/loadgen_protocol.py loadgen-rust/target/release/pipeline-loadgen-rust --task-mode
      - name: Validate daily generator build and bundle
        run: |
          ./tools/build_generators.sh
          python3 tools/generator_bundle.py verify .loadgen-build
          python3 tests/loadgen_protocol.py .loadgen-build/loadgen-rust
      - run: pip install -r tests/requirements.txt
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tools/*.test.mjs
      - run: python3 tests/fixed_smoke.py
      - run: python3 tests/smoke.py
      - name: Upload fixture artifact to verify release transport
        uses: actions/upload-artifact@v7
        with:
          name: artifact-transport-fixtures
          path: |
            payloads/fixed-nginx.ndjson
            docs/fixed-throughput.md
          if-no-files-found: error
          retention-days: 1
      - name: Download fixture artifact
        uses: actions/download-artifact@v8
        with:
          name: artifact-transport-fixtures
          path: ${{ runner.temp }}/artifact-transport-fixtures
      - name: Verify artifact contents are unchanged
        run: |
          cmp payloads/fixed-nginx.ndjson "$RUNNER_TEMP/artifact-transport-fixtures/payloads/fixed-nginx.ndjson"
          cmp docs/fixed-throughput.md "$RUNNER_TEMP/artifact-transport-fixtures/docs/fixed-throughput.md"
