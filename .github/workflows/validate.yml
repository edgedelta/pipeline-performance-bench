name: Validate benchmark harness
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      otlp_benchmark:
        description: 'Run isolated metrics/traces preview; artifacts only, never publish or merge'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate Rust generator and matching HTTP behavior
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          cargo +1.98.0 fmt --manifest-path loadgen-rust/Cargo.toml --check
          cargo +1.98.0 clippy --locked --manifest-path loadgen-rust/Cargo.toml --all-targets -- -D warnings
          cargo +1.98.0 test --locked --manifest-path loadgen-rust/Cargo.toml
          cargo +1.98.0 build --locked --release --manifest-path loadgen-rust/Cargo.toml
          python3 tests/loadgen_protocol.py loadgen-rust/target/release/pipeline-loadgen-rust
          python3 tests/loadgen_protocol.py loadgen-rust/target/release/pipeline-loadgen-rust --task-mode
      - name: Validate daily generator build and bundle
        run: |
          ./tools/build_generators.sh
          python3 tools/generator_bundle.py verify .loadgen-build
          python3 tests/loadgen_protocol.py .loadgen-build/loadgen-rust
      - run: pip install -r tests/requirements.txt -r otlpbench/requirements.txt
      - run: python3 -m unittest otlpbench.test_model -v
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tools/*.test.mjs
      - run: python3 tests/fixed_smoke.py
      - run: python3 tests/smoke.py
      - name: Validate Bindplane production configs and HTTP behavior
        shell: bash
        run: |
          set -euo pipefail
          version=$(curl -fLsS --retry 3 https://api.github.com/repos/observIQ/bindplane-otel-collector/releases/latest | jq -er '.tag_name')
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          base="https://github.com/observIQ/bindplane-otel-collector/releases/download/$version"
          archive="observiq-otel-collector-${version}-linux-amd64.tar.gz"
          checksums="observiq-otel-collector-${version}-SHA256SUMS"
          mkdir -p "$RUNNER_TEMP/bindplane"
          cd "$RUNNER_TEMP/bindplane"
          curl -fLsS --retry 3 -O "$base/$archive"
          curl -fLsS --retry 3 -O "$base/$checksums"
          awk -v archive="$archive" '$2 == archive || $2 == "*" archive { print; found=1 } END { if (!found) exit 1 }' "$checksums" > archive.sha256
          sha256sum --check archive.sha256
          tar -xzf "$archive"
          cd "$GITHUB_WORKSPACE"
          python3 tests/bindplane_smoke.py "$RUNNER_TEMP/bindplane/observiq-otel-collector"
      - name: Upload fixture artifact to verify release transport
        uses: actions/upload-artifact@v7
        with:
          name: artifact-transport-fixtures
          path: |
            payloads/fixed-nginx.ndjson
            docs/fixed-throughput.md
          if-no-files-found: error
          retention-days: 1
      - name: Download fixture artifact
        uses: actions/download-artifact@v8
        with:
          name: artifact-transport-fixtures
          path: ${{ runner.temp }}/artifact-transport-fixtures
      - name: Verify artifact contents are unchanged
        run: |
          cmp payloads/fixed-nginx.ndjson "$RUNNER_TEMP/artifact-transport-fixtures/payloads/fixed-nginx.ndjson"
          cmp docs/fixed-throughput.md "$RUNNER_TEMP/artifact-transport-fixtures/docs/fixed-throughput.md"

  otlp-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.otlp_benchmark
    strategy:
      fail-fast: false
      matrix:
        vendor: [red, edgedelta, bindplane, otelcol, vector, fluentbit, fluentd, cribl]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BEDROCK_ROLE }}
          role-duration-seconds: 7200
          aws-region: us-west-2
      - name: Run isolated OTLP preview
        env:
          GH_TOKEN: ${{ secrets.RED_RELEASES_TOKEN }}
        run: bash otlpbench/cloud.sh '${{ matrix.vendor }}'
      - name: Refresh cleanup credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BEDROCK_ROLE }}
          role-duration-seconds: 7200
          aws-region: us-west-2
      - name: Destroy preview instance
        if: always()
        run: |
          if test -f otlpbench/infra/terraform.tfstate; then terraform -chdir=otlpbench/infra destroy -auto-approve; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: otlp-${{ matrix.vendor }}-${{ github.run_id }}
          path: otlp-results/
          if-no-files-found: warn
  otlp-report:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.otlp_benchmark
    needs: [otlp-preview]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r otlpbench/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          pattern: otlp-*
          path: otlp-shards
      - run: python -m otlpbench.report otlp-shards --output otlp-preview.md
      - run: cat otlp-preview.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: otlp-pr-preview-${{ github.run_id }}
          path: |
            otlp-preview.md
            otlp-preview.html
