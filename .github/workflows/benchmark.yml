name: Pipeline performance bench
on:
  schedule:
    # Daily at 09:17 UTC. For Mondays only, change to: 17 9 * * 1
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: 'short: pass-through validation at 10k/125k, artifacts only; full: complete published suite'
        type: choice
        options: [full, short]
        default: full
        required: true
      vendors:
        description: 'Agents: edgedelta,red,cribl,otelcol,fluentd,vector,fluentbit'
        default: 'edgedelta,red,cribl,otelcol,fluentd,vector,fluentbit'
        required: true
      cases:
        description: 'Cases: pass-through,filter,mask,lookup'
        default: 'pass-through,filter,mask,lookup'
        required: true
permissions:
  contents: read
concurrency:
  group: pipeline-performance-bench
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      timestamp: ${{ steps.plan.outputs.timestamp }}
    steps:
      - uses: actions/checkout@v6
      - id: plan
        env:
          VENDORS: ${{ inputs.vendors || 'edgedelta,red,cribl,otelcol,fluentd,vector,fluentbit' }}
          BENCHMARK_PROFILE: ${{ inputs.profile || 'full' }}
          CASES: ${{ inputs.cases || 'pass-through,filter,mask,lookup' }}
        run: |
          echo "matrix=$(python3 tools/parallel.py plan "$VENDORS" "$CASES")" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_OUTPUT"
  build-generators:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache: false
      - name: Install Rust compiler
        run: rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .loadgen-build/rust-target
          key: loadgen-rust-linux-amd64-1.98.0-${{ hashFiles('loadgen-rust/Cargo.lock', 'loadgen-rust/src/**/*.rs', 'loadgen-rust/Cargo.toml') }}
          restore-keys: loadgen-rust-linux-amd64-1.98.0-
      - name: Build both generators before AWS provisioning
        run: ./tools/build_generators.sh
      - uses: actions/upload-artifact@v7
        with:
          name: load-generators-${{ github.run_id }}
          path: |
            .loadgen-build/loadgen
            .loadgen-build/loadgen-rust
            .loadgen-build/provenance.json
            .loadgen-build/rust-provenance.json
            .loadgen-build/generators.json
          include-hidden-files: true
          if-no-files-found: error
  benchmark:
    needs: [plan, build-generators]
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: load-generators-${{ github.run_id }}
          path: .loadgen-build
      - name: Verify prebuilt generators
        run: python3 tools/generator_bundle.py verify .loadgen-build
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BEDROCK_ROLE }}
          role-duration-seconds: 7200
          aws-region: us-west-2
      - name: Run isolated agent benchmark
        env:
          VENDORS: ${{ matrix.vendor }}
          CASES: ${{ matrix.cases }}
          BENCHMARK_PROFILE: ${{ inputs.profile || 'full' }}
          BENCHMARK_EXECUTION_MODE: parallel-agent-shard
          BENCHMARK_EXTERNAL_AWS_CLEANUP: "1"
          BENCHMARK_PREBUILT_LOADGEN: "1"
          ED_ORG_ID: ${{ secrets.ED_ORG_ID }}
          ED_API_TOKEN: ${{ secrets.ED_API_TOKEN }}
          CRIBL_CLIENT_ID: ${{ secrets.CRIBL_CLIENT_ID }}
          CRIBL_CLIENT_SECRET: ${{ secrets.CRIBL_CLIENT_SECRET }}
          CRIBL_LEADER_TOKEN: ${{ secrets.CRIBL_LEADER_TOKEN }}
          CRIBL_ORG: ${{ secrets.CRIBL_ORG }}
          CRIBL_WORKSPACE: ${{ secrets.CRIBL_WORKSPACE }}
          CRIBL_WORKER_GROUP: ${{ secrets.CRIBL_WORKER_GROUP }}
        run: timeout --signal=TERM --kill-after=5m 120m ./run.sh --vendors "$VENDORS" --cases "$CASES"
      - name: Refresh credentials for AWS cleanup
        if: always()
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BEDROCK_ROLE }}
          role-duration-seconds: 7200
          retry-max-attempts: 2
          aws-region: us-west-2
      - name: Clean up this agent's AWS resources
        if: always()
        run: |
          if test -f aws_resources/terraform.tfstate; then terraform -chdir=aws_resources destroy -auto-approve; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pipeline-bench-${{ github.run_id }}-${{ matrix.vendor }}
          path: |
            benchmark_results/*/*.log
            benchmark_results/*/versions.csv
            benchmark_results/*/*.json
            benchmark_results/*/*.ndjson
          if-no-files-found: error
  report:
    permissions:
      contents: write
    needs: [plan, benchmark]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: pipeline-bench-${{ github.run_id }}-*
          path: shards
      - name: Validate and combine agent results
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          TIMESTAMP: ${{ needs.plan.outputs.timestamp }}
        run: python3 tools/parallel.py merge shards "benchmark_results/$TIMESTAMP" "$MATRIX" --require-fixed
      - name: Check short-run recovery and label validation report
        if: inputs.profile == 'short'
        env:
          TIMESTAMP: ${{ needs.plan.outputs.timestamp }}
        run: |
          python3 tools/check_short.py "benchmark_results/$TIMESTAMP"
          cat "benchmark_results/$TIMESTAMP/short-validation.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: pipeline-bench-${{ github.run_id }}-combined
          path: benchmark_results/
          if-no-files-found: error
      - name: Publish dated release for the full suite
        if: inputs.profile != 'short'
        env:
          GH_TOKEN: ${{ github.token }}
          TIMESTAMP: ${{ needs.plan.outputs.timestamp }}
        run: python3 tools/publish_release.py "benchmark_results/$TIMESTAMP" --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
