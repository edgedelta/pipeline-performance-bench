name: Pipeline performance bench
on:
  schedule:
    # Daily at 09:17 UTC. For Mondays only, change to: 17 9 * * 1
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: 'short: reduced validation of all signals; full: complete logs, metrics and traces'
        type: choice
        options: [full, short]
        default: full
        required: true
      rust_commit:
        description: 'Optional full Rust commit SHA; wait for its qualified candidate'
        type: string
        default: ''
      vendors:
        description: 'Log agents: edgedelta,red,cribl,otelcol,fluentd,vector,fluentbit,bindplane'
        default: 'edgedelta,red,cribl,otelcol,fluentd,vector,fluentbit,bindplane'
        required: true
      cases:
        description: 'Log cases: pass-through,filter,mask,lookup'
        default: 'pass-through,filter,mask,lookup'
        required: true
permissions:
  contents: read
concurrency:
  group: pipeline-performance-bench
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      timestamp: ${{ steps.plan.outputs.timestamp }}
    steps:
      - uses: actions/checkout@v6
      - id: plan
        env:
          VENDORS: ${{ inputs.vendors || 'edgedelta,red,cribl,otelcol,fluentd,vector,fluentbit,bindplane' }}
          BENCHMARK_PROFILE: ${{ inputs.profile || 'full' }}
          CASES: ${{ inputs.cases || 'pass-through,filter,mask,lookup' }}
        run: |
          echo "matrix=$(python3 tools/parallel.py plan "$VENDORS" "$CASES")" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_OUTPUT"
  build-generators:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust compiler
        run: rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .loadgen-build/rust-target
          key: loadgen-rust-linux-amd64-1.98.0-${{ hashFiles('loadgen-rust/Cargo.lock', 'loadgen-rust/src/**/*.rs', 'loadgen-rust/Cargo.toml') }}
          restore-keys: loadgen-rust-linux-amd64-1.98.0-
      - name: Build Rust generator before AWS provisioning
        run: ./tools/build_generators.sh
      - name: Build OTLP generator and resolve shared Rust candidate
        env:
          GH_TOKEN: ${{ secrets.RED_RELEASES_TOKEN }}
          REQUIRED_COMMIT: ${{ inputs.rust_commit }}
        run: |
          cargo +1.98.0 build --locked --release --manifest-path otlpbench/traffic-rs/Cargo.toml
          cp otlpbench/traffic-rs/target/release/otlp-traffic .loadgen-build/otlp-traffic
          commit=()
          if [[ -n "$REQUIRED_COMMIT" ]]; then commit=(--commit "$REQUIRED_COMMIT" --wait-seconds 2700); fi
          python3 tools/fetch_red.py .loadgen-build --candidate "${commit[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: load-generators-${{ github.run_id }}
          path: |
            .loadgen-build/loadgen-rust
            .loadgen-build/rust-provenance.json
            .loadgen-build/generators.json
            .loadgen-build/otlp-traffic
            .loadgen-build/red
            .loadgen-build/release.json
            .loadgen-build/release-manifest.json
          include-hidden-files: true
          if-no-files-found: error
  benchmark:
    needs: [plan, build-generators]
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: load-generators-${{ github.run_id }}
          path: .loadgen-build
      - name: Verify prebuilt generators
        run: python3 tools/generator_bundle.py verify .loadgen-build
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BEDROCK_ROLE }}
          role-duration-seconds: 7200
          aws-region: us-west-2
      - name: Run isolated agent benchmark
        env:
          VENDORS: ${{ matrix.vendor }}
          CASES: ${{ matrix.cases }}
          BENCHMARK_PROFILE: ${{ inputs.profile || 'full' }}
          BENCHMARK_EXECUTION_MODE: parallel-agent-shard
          BENCHMARK_EXTERNAL_AWS_CLEANUP: "1"
          BENCHMARK_PREBUILT_LOADGEN: "1"
          ED_ORG_ID: ${{ secrets.ED_ORG_ID }}
          ED_API_TOKEN: ${{ secrets.ED_API_TOKEN }}
          CRIBL_CLIENT_ID: ${{ secrets.CRIBL_CLIENT_ID }}
          CRIBL_CLIENT_SECRET: ${{ secrets.CRIBL_CLIENT_SECRET }}
          CRIBL_LEADER_TOKEN: ${{ secrets.CRIBL_LEADER_TOKEN }}
          CRIBL_ORG: ${{ secrets.CRIBL_ORG }}
          CRIBL_WORKSPACE: ${{ secrets.CRIBL_WORKSPACE }}
          CRIBL_WORKER_GROUP: ${{ secrets.CRIBL_WORKER_GROUP }}
          RED_BINARY: ${{ github.workspace }}/.loadgen-build/red
          RED_RELEASE_METADATA: ${{ github.workspace }}/.loadgen-build/release.json
          # Shared candidate was resolved once before the suites started.
          GH_TOKEN: ${{ secrets.RED_RELEASES_TOKEN }}
        run: timeout --signal=TERM --kill-after=5m 120m ./run.sh --vendors "$VENDORS" --cases "$CASES"
      - name: Refresh credentials for AWS cleanup
        if: always()
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BEDROCK_ROLE }}
          role-duration-seconds: 7200
          retry-max-attempts: 2
          aws-region: us-west-2
      - name: Clean up this agent's AWS resources
        if: always()
        run: |
          if test -f aws_resources/terraform.tfstate; then terraform -chdir=aws_resources destroy -auto-approve; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pipeline-bench-${{ github.run_id }}-${{ matrix.vendor }}
          path: |
            benchmark_results/*/*.log
            benchmark_results/*/versions.csv
            benchmark_results/*/*.json
            benchmark_results/*/*.ndjson
          if-no-files-found: error
  report:
    permissions:
      contents: write
    needs: [plan, benchmark]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: pipeline-bench-${{ github.run_id }}-*
          path: shards
      - name: Validate and combine agent results
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          TIMESTAMP: ${{ needs.plan.outputs.timestamp }}
        run: python3 tools/parallel.py merge shards "benchmark_results/$TIMESTAMP" "$MATRIX" --require-fixed
      - name: Check short-run recovery and label validation report
        if: inputs.profile == 'short'
        env:
          TIMESTAMP: ${{ needs.plan.outputs.timestamp }}
        run: |
          python3 tools/check_short.py "benchmark_results/$TIMESTAMP"
          cat "benchmark_results/$TIMESTAMP/short-validation.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: pipeline-bench-${{ github.run_id }}-combined
          path: benchmark_results/
          if-no-files-found: error
      - name: Publish dated release for the full suite
        if: inputs.profile != 'short' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TIMESTAMP: ${{ needs.plan.outputs.timestamp }}
        run: python3 tools/publish_release.py "benchmark_results/$TIMESTAMP" --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  otlp:
    name: OTLP / ${{ matrix.signal }} / ${{ matrix.vendor }}
    needs: build-generators
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        signal: [metrics, traces]
        vendor: [red, otelcol, bindplane]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: load-generators-${{ github.run_id }}
          path: .loadgen-build
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r otlpbench/requirements.txt
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BEDROCK_ROLE }}
          role-duration-seconds: 7200
          aws-region: us-west-2
      - name: Run isolated signal ladder
        env:
          SIGNAL: ${{ matrix.signal }}
          VENDOR: ${{ matrix.vendor }}
          PROFILE: ${{ inputs.profile || 'full' }}
          BENCHMARK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: timeout --signal=TERM --kill-after=5m 150m python3 -u tools/otlp_daily.py --signal "$SIGNAL" --vendor "$VENDOR" --profile "$PROFILE"
      - name: Refresh credentials for cleanup
        if: always()
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BEDROCK_ROLE }}
          role-duration-seconds: 7200
          retry-max-attempts: 2
          aws-region: us-west-2
      - name: Destroy this signal's isolated hosts
        if: always()
        run: |
          if test -f otlpbench/infra-rps/terraform.tfstate; then
            terraform -chdir=otlpbench/infra-rps destroy -auto-approve -var=instance_type=c8i.8xlarge
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: otlp-daily-${{ github.run_id }}-${{ matrix.signal }}-${{ matrix.vendor }}
          path: otlp-daily-results/
          if-no-files-found: warn
  otlp-report:
    needs: [plan, otlp]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: otlp-daily-${{ github.run_id }}-*
          path: otlp-shards
      - name: Validate vendor shards and publish full OTLP evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TIMESTAMP: ${{ needs.plan.outputs.timestamp }}
          PROFILE: ${{ inputs.profile || 'full' }}
        run: |
          publish=()
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then publish=(--publish); fi
          python3 tools/publish_otlp.py otlp-shards otlp-release --profile "$PROFILE" --commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --tag "otlp-${TIMESTAMP//_/-}" "${publish[@]}"
      - uses: actions/upload-artifact@v7
        if: inputs.profile != 'short'
        with:
          name: otlp-release-${{ github.run_id }}
          path: otlp-release/
          if-no-files-found: error
