[SERVICE]
    Flush 1
    Grace 60
    Log_Level info

[INPUT]
    Name http
    Listen 0.0.0.0
    Port 2085
    Tag benchmark
    Buffer_Max_Size 16M
    Mem_Buf_Limit 256M
    Successful_Response_Code 200

[FILTER]
    Name lua
    Match *
    script /etc/fluent-bit/lookup.lua
    call enrich

[OUTPUT]
    Name s3
    Match *
    bucket {S3_PLACEHOLDER}
    region us-west-2
    store_dir /var/lib/fluent-bit/s3
    store_dir_limit_size 2G
    total_file_size 8M
    upload_timeout 30s
    use_put_object On
    compression gzip
    s3_key_format /fluentbit/%Y/%m/%d/%H/%M/%S-$UUID.gz
