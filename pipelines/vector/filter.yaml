data_dir: /var/lib/vector
sources:
  http:
    type: http_server
    address: 0.0.0.0:4085
    decoding:
      codec: json
    framing:
      method: bytes
    acknowledgements:
      enabled: false
transforms:
  process:
    type: filter
    inputs:
    - http
    condition: .pii.color != "Green"
sinks:
  s3:
    type: aws_s3
    inputs:
    - process
    bucket: '{S3_PLACEHOLDER}'
    region: us-west-2
    key_prefix: vector/%Y/%m/%d/%H/
    compression: gzip
    encoding:
      codec: json
    batch:
      max_bytes: 8388608
      timeout_secs: 30
    buffer:
      type: memory
      max_events: 20000
      when_full: block
    acknowledgements:
      enabled: false
