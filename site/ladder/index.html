<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pipeline Performance Benchmarks · Ladder</title>
<style>
*{box-sizing:border-box}a{color:#2563eb;text-decoration:none}a:hover{text-decoration:underline}.dark a{color:#93baff}body{margin:0;background:#f2f4f6;color:#17202c;font:15px system-ui,-apple-system,sans-serif}main{max-width:1250px;margin:44px auto;padding:0 28px}header{display:flex;justify-content:space-between;align-items:center;gap:24px}h1{font-size:32px;letter-spacing:-1px;margin:10px 0}p{color:#667181;line-height:1.6}.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:1.8px;color:#687588;font-weight:650}.tabs{display:flex;gap:4px;padding:5px;background:#e5e9ee;border-radius:12px}button,select{font:inherit;cursor:pointer;color:inherit}button{border:0;background:transparent;padding:10px 18px;border-radius:8px}button[aria-pressed=true]{background:white;box-shadow:0 1px 4px #17202c12;font-weight:600}button:focus-visible,select:focus-visible{outline:2px solid #3b82f6;outline-offset:3px}.toolbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:25px 0 18px}select{padding:10px 14px;background:white;border:1px solid #d8dee5;border-radius:9px}.key{display:flex;gap:18px;color:#677384;font-size:13px;align-items:center}.solid,.dotted{display:inline-block;width:25px;border-top:2px solid #87919e;vertical-align:middle;margin-right:6px}.dotted{border-top-style:dotted}.card{background:#fff;border:1px solid #dfe4ea;border-radius:16px;margin:20px 0;padding:24px 26px 14px;box-shadow:0 3px 12px #17202c03}.card h2{font-size:20px;letter-spacing:-.4px;margin:0}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:20px}.cardhead small{color:#798493}.chartrow{display:grid;grid-template-columns:minmax(0,1fr) 225px;gap:20px;align-items:center}svg{width:100%;overflow:visible}.legend{display:flex;flex-direction:column;gap:9px}.legend button{padding:3px 0;text-align:left;font-size:12px;display:flex;gap:9px;align-items:center;line-height:1.5}.legend .off{opacity:.28}.swatch{width:10px;height:10px;display:inline-block;border-radius:50%;flex-shrink:0}.legend small{display:block;color:#7c8794;font-size:10px}.tick{fill:#788391;font-size:11px}.grid{stroke:#e5e9ee}.axis{fill:#596675;font-size:11px}footer{font-size:12px;color:#778391;padding:8px 0 30px;line-height:1.8}#tip{position:fixed;display:none;pointer-events:none;background:#17202c;color:#fff;border-radius:10px;padding:12px 15px;font-size:12px;line-height:1.7;box-shadow:0 6px 30px #0003;z-index:3;max-width:300px}body.dark{background:#111315;color:#e4e7eb}.dark .card{background:#1c1f22;border-color:#34383d}.dark p,.dark .key{color:#a0a8b2}.dark .tabs{background:#24282d}.dark button[aria-pressed=true],.dark select{background:#343a41;color:#eee}.dark .grid{stroke:#353b42}.dark .tick,.dark .axis{fill:#a2abb6}@media(max-width:850px){main{padding:0 16px;margin:25px auto}header{align-items:flex-start;flex-direction:column}h1{font-size:27px}.toolbar{flex-wrap:wrap}.chartrow{grid-template-columns:1fr}.legend{flex-direction:row;flex-wrap:wrap;gap:8px 18px;margin-bottom:12px}.legend small{display:none}.card{padding:18px}.key{flex-wrap:wrap}.cardhead small{display:none}}
</style><main><header><div><div class="eyebrow">Benchmark results · load ladder</div><h1>Pipeline Performance Benchmarks</h1><p id="subtitle"></p></div><nav class="tabs" aria-label="Signal"><button data-signal="logs" aria-pressed="true">Logs</button><button data-signal="metrics" aria-pressed="false">Metrics</button><button data-signal="traces" aria-pressed="false">Traces</button></nav></header>
<nav aria-label="Benchmark pages" style="display:flex;gap:20px;margin-top:20px"><a href="../logs/">Logs</a><a href="../metrics/">Metrics</a><a href="../traces/">Traces</a><a href="./" aria-current="page">Ladder</a></nav><div class="toolbar"><div><strong style="margin-right:15px">Ladder</strong><select id="measure" aria-label="Measure"></select></div><div class="key"><span><i class="solid"></i>Sustained load</span><span><i class="dotted"></i>Fell short ×</span><button id="theme">Dark theme</button></div></div><div id="charts"></div><footer id="footer"></footer></main><div id="tip" role="tooltip"></div>
<script>
const DATA=__DATA__;
const vendors=[['red','Edge Delta (Rust)','#009E49'],['ed','Edge Delta (Go)','#2563EB'],['bp','Bindplane (Dynatrace)','#C62828'],['otel','OpenTelemetry Collector','#7C3AED'],['cribl','Cribl','#E66B00'],['vector','Vector (Datadog)','#9A7800'],['fluentbit','Fluent Bit','#D12C91'],['fluentd','Fluentd','#007E87']];
const shapes={red:'circle',ed:'square',bp:'triangle',otel:'diamond',cribl:'pentagon',vector:'hexagon',fluentbit:'star',fluentd:'plus'};
function marker(key,x,y,color,size=5){const shape=shapes[key];if(shape==='circle')return `<circle cx="${x}" cy="${y}" r="${size}" fill="${color}"/>`;if(shape==='square')return `<rect x="${x-size}" y="${y-size}" width="${size*2}" height="${size*2}" rx="1" fill="${color}"/>`;if(shape==='plus')return `<path d="M${x-size},${y}h${size*2}M${x},${y-size}v${size*2}" stroke="${color}" stroke-width="3"/>`;const count={triangle:3,diamond:4,pentagon:5,hexagon:6,star:10}[shape];const points=Array.from({length:count},(_,i)=>{const a=-Math.PI/2+i*2*Math.PI/count,r=shape==='star'&&i%2?size*.45:size*1.2;return `${x+Math.cos(a)*r},${y+Math.sin(a)*r}`}).join(' ');return `<polygon points="${points}" fill="${color}"/>`}
const aliases={red:'red',otel:'otelcol',bp:'bindplane'};
let signal='logs',measure='efficiency';const hidden=new Set();
const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(n),compact=n=>new Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:1}).format(n);
const labels={'pass-through':'Pass-Through',filter:'Filter',mask:'Mask',lookup:'Lookup',aggregate:'Aggregate',rollup:'Rollup',combined:'Combined',sample:'Sample',tail:'Tail'};
const units=()=>signal==='logs'?'logs':signal==='metrics'?'points':'spans';
function config(){const u=units();return {efficiency:[u+'/sec per CPU core','Higher is better'],memory_efficiency:[u+'/sec per MB','Higher is better'],cpu:['CPU cores','Lower is better'],memory:['Memory MB','Lower is better'],rate:[u+'/sec reached','Higher is better']}}
function cell(si,rate,v){const d=DATA[signal];if(signal==='logs'){const c=d.ladder.agents[v]?.[si]?.[d.ladder.targets.indexOf(rate)];if(!c||!Number.isFinite(c.lpc))return null;return {value:({efficiency:c.lpc,memory_efficiency:c.lpm,cpu:c.cpu/100,memory:c.mem,rate:c.ack})[measure],ok:c.s==='ok',status:c.s,actual:c.ack,offered:rate}}
 const r=d.rows.find(r=>r.vendor===aliases[v]&&r.scenario===d.scenarios[si]&&r.target_rps===rate);if(!r||!r.operation_verified||!(r.delivery_verified||r.sampling_verified)||r.output_batch_verified===false)return null;const points=r.load.achieved_rps*r.batch,cpu=r.through_delivery.cpu_seconds/(signal==='traces'?r.load.seconds:r.input_window.elapsed_seconds),mem=r.through_delivery.rss_mb;return {value:({efficiency:points/cpu,memory_efficiency:points/mem,cpu,memory:mem,rate:points})[measure],ok:r.status==='measured',status:r.status,actual:points,offered:rate*d.batch}}
function render(){const d=DATA[signal],rates=signal==='logs'?d.ladder.targets:d.rates,vs=vendors.filter(v=>signal==='logs'||aliases[v[0]]),cfg=config();$('measure').innerHTML=Object.entries(cfg).map(([k,v])=>`<option value="${k}" ${k===measure?'selected':''}>${v[0]}</option>`).join('');document.querySelectorAll('[data-signal]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.signal===signal)));$('subtitle').textContent=`${signal[0].toUpperCase()+signal.slice(1)} · All scenarios across increasing load · ${d.date||(d.measured_at||d.measured_date).slice(0,10)}`;
 $('charts').innerHTML=d.scenarios.map((s,si)=>{const points=vs.filter(v=>!hidden.has(v[0])).flatMap(v=>rates.map(r=>cell(si,r,v[0]))).filter(c=>c&&Number.isFinite(c.value));let raw=Math.max(1,...points.map(c=>c.value))*1.12;const step=10**Math.floor(Math.log10(raw/4));const tickStep=Math.ceil(raw/4/step)*step,max=tickStep*4;const W=760,L=70,R=735,T=42,B=274,x=i=>L+(R-L)*i/(rates.length-1),y=v=>B-(B-T)*v/max;
 let svg=`<svg viewBox="0 0 760 340" role="img" aria-label="${labels[s]||s} ${cfg[measure][0]} ladder"><title>${labels[s]||s} · ${cfg[measure][0]}</title><text class="axis" x="${L}" y="20">${cfg[measure][0]}</text>`;
 for(let i=0;i<=4;i++){svg+=`<line class="grid" x1="${L}" x2="${R}" y1="${y(i*tickStep)}" y2="${y(i*tickStep)}"/><text class="tick" text-anchor="end" x="${L-12}" y="${y(i*tickStep)+4}">${compact(i*tickStep)}</text>`}
 rates.forEach((r,i)=>{const name=['Lowest','Low','Medium','High','Highest'][5-rates.length+i];svg+=`<text class="tick" text-anchor="middle" x="${x(i)}" y="298">${name}</text><text class="tick" text-anchor="middle" x="${x(i)}" y="315">${compact(r)} ${signal==='logs'?'logs/s':'req/s'}</text>`});
 vs.filter(v=>!hidden.has(v[0])).forEach(([key,name,color])=>{let prev=null;rates.forEach((r,i)=>{const c=cell(si,r,key);if(!c||!Number.isFinite(c.value)){prev=null;return}const px=x(i),py=y(c.value);if(prev)svg+=`<line x1="${prev.x}" y1="${prev.y}" x2="${px}" y2="${py}" stroke="${color}" stroke-width="2.5" ${prev.ok&&c.ok?'':'stroke-dasharray="2 6" stroke-linecap="round"'}/>`;const title=`${name} | ${fmt(c.value)} ${cfg[measure][0]} | Offered: ${fmt(c.offered)} ${units()}/s | Reached: ${fmt(c.actual)} ${units()}/s | ${c.status.replaceAll('_',' ')}`;svg+=`<g class="point" tabindex="0" aria-label="${title}" data-tip="${title}"><circle cx="${px}" cy="${py}" r="12" fill="transparent"/>${c.ok?marker(key,px,py,color):`<path d="M${px-4},${py-4}l8,8m0,-8l-8,8" stroke="${color}" stroke-width="2"/>`}</g>`;prev={x:px,y:py,ok:c.ok}})});svg+='</svg>';
 const legend=vs.map(([key,name,color])=>{const present=rates.some(r=>cell(si,r,key));const version=d.versions?.[signal==='logs'?key:aliases[key]]||'';return `<button data-vendor="${key}" class="${hidden.has(key)?'off':''}" aria-pressed="${!hidden.has(key)}"><svg style="width:18px;height:18px;flex-shrink:0" viewBox="0 0 20 20" aria-hidden="true">${marker(key,10,10,color,5)}</svg><span>${name}<small>${present?version:'No comparable measurement'}</small></span></button>`}).join('');return `<section class="card"><div class="cardhead"><h2>${labels[s]||s}</h2><small>${cfg[measure][1]} · hover a point for details</small></div><div class="chartrow">${svg}<div class="legend">${legend}</div></div></section>`}).join('');
 $('footer').textContent=`Measured data only · ${signal==='logs'?'Run '+d.runId:'Full run '+(d.measured_at||d.measured_date).slice(0,10)+' · 512 '+units()+'/request'} · Loads are evenly spaced categories. Dotted segments and × markers indicate a load shortfall; hover for the recorded cause. Generator-limited results do not establish agent capacity. Unmeasured or unsupported loads are left blank. Click a vendor to show or hide it. Measurements come from the published benchmark datasets.`;
 document.querySelectorAll('[data-vendor]').forEach(b=>b.onclick=()=>{hidden.has(b.dataset.vendor)?hidden.delete(b.dataset.vendor):hidden.add(b.dataset.vendor);render()});document.querySelectorAll('.point').forEach(p=>{const show=e=>{const t=$('tip');t.textContent=p.dataset.tip;t.style.display='block';const box=p.getBoundingClientRect();t.style.left=Math.max(10,Math.min(innerWidth-310,(e.clientX||box.x)+15))+'px';t.style.top=Math.max(10,Math.min(innerHeight-150,(e.clientY||box.y)-90))+'px'};p.onmousemove=show;p.onfocus=show;p.onmouseleave=p.onblur=()=>{$('tip').style.display='none'}})
}
document.querySelectorAll('[data-signal]').forEach(b=>b.onclick=()=>{signal=b.dataset.signal;render()});$('measure').onchange=e=>{measure=e.target.value;render()};$('theme').onclick=()=>{document.body.classList.toggle('dark');$('theme').textContent=document.body.classList.contains('dark')?'Light theme':'Dark theme'};render();
</script></html>
